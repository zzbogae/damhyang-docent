[project]
name = "mined-core"
version = "0.7.0"
description = "Mine D 주 단위 판정 코어 (CPython CLI 와 브라우저 Pyodide 에서 같은 코드로 실행)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
research = ["scipy>=1.14", "ruptures>=1.1.10", "stumpy>=1.14", "statsmodels>=0.15"]
synth = ["pillow>=11", "piexif>=1.1.3"]

[project.scripts]
mined = "mined_core.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mined_core"]
