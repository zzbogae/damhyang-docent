<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
iframe.stage{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transition:opacity .8s ease}
iframe.stage.on{opacity:1;pointer-events:auto}
#toStrata{position:fixed;right:22px;bottom:22px;z-index:20;border:1px solid rgba(242,195,116,.7);background:rgba(12,14,16,.78);color:#f2c374;border-radius:999px;padding:12px 18px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);transition:transform .2s,box-shadow .2s}
#toStrata.pulse{box-shadow:0 0 0 0 rgba(242,195,116,.6);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 14px rgba(242,195,116,0)}100%{box-shadow:0 0 0 0 rgba(242,195,116,0)}}
#toStrata.hide{display:none}
#today{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;padding:0 24px 64px;background:linear-gradient(180deg,rgba(6,8,10,.15),rgba(6,8,10,.72))}
#today.show{display:flex}
.tbox{display:flex;align-items:flex-end;gap:18px;max-width:760px;width:100%}
.tbox img{width:130px;flex:none;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{position:relative;flex:1;background:#f5efe3;color:#2a2620;border-radius:22px;padding:22px 24px 20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.bubble:before{content:"";position:absolute;left:-12px;bottom:34px;border:12px solid transparent;border-right-color:#f5efe3;border-left:0}
.who{font-size:11px;letter-spacing:.18em;color:#a17b3a;margin-bottom:8px}
#line{font:500 19px/1.65 "Apple SD Gothic Neo","Noto Serif KR",Georgia,serif;min-height:32px;white-space:pre-wrap}
#ask{margin-top:14px;font-size:15px;color:#5b5346;opacity:0;transition:opacity .5s}
.choices{display:flex;gap:10px;margin-top:14px;opacity:0;transition:opacity .5s}
.choices.on,#ask.on{opacity:1}
.choices button{flex:1;border:1px solid #c9a15a;background:#fff8ea;color:#5a3f12;border-radius:14px;padding:12px;font-size:14px;cursor:pointer}
.choices button:hover{background:#f2c374}
#mute{position:fixed;left:18px;bottom:18px;z-index:31;background:rgba(0,0,0,.4);color:#ddd;border:0;border-radius:999px;padding:8px 12px;font-size:12px;cursor:pointer;display:none}
#today.show ~ #mute{display:block}
</style>

<button id="mute">소리 끄기</button>
<script>
/* 민디의 오늘 한 마디 — 가르치지 않고, 판정하지 않고, 툭 던지는 한 줄 (날짜마다 바뀜) */
const LINES=[
  "오늘 하늘은 어제와 다른 모양이에요.\n늘 그래왔지만요.",
  "강아지는 하루를 다 쓰고 잠들어요.\n아무것도 남겨두지 않고요.",
  "걸음이 적은 날에도\n지층은 한 겹 쌓여요.",
  "어제 남긴 메모가\n오늘은 조금 다르게 읽힐지도 몰라요.",
  "바다는 매일 같은 자리에서\n다른 파도를 보내요.",
  "기록이 없는 날도\n비어 있는 날은 아니에요.",
  "오늘 처음 마신 물은\n몇 시였을까요.",
  "오늘의 노을은\n오늘만 볼 수 있어요."
];
const today=new Date(); const doy=Math.floor((today-new Date(today.getFullYear(),0,0))/864e5);
const LINE=LINES[doy%LINES.length];

/* 사운드 — 미니언 '느낌'의 귀여운 옹알이를 Web Audio로 그 자리에서 합성 (외부 음원·캐릭터 음성 미사용) */
let ac=null,muted=false;
function blip(t,f){const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),bp=ac.createBiquadFilter();
  o.type='square';o2.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(Math.random()<.5?1.35:.78),t+.09);
  o2.frequency.setValueAtTime(f*2.01,t);bp.type='bandpass';bp.frequency.value=900+Math.random()*900;bp.Q.value=2.2;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.11);
  o.connect(bp);o2.connect(bp);bp.connect(g);g.connect(ac.destination);o.start(t);o2.start(t);o.stop(t+.12);o2.stop(t+.12)}
function babble(n){if(muted)return;ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t0=ac.currentTime+.02;
  for(let i=0;i<n;i++)blip(t0+i*.085+Math.random()*.02,330+Math.random()*320)}
function giggle(){if(muted)return;ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t0=ac.currentTime+.02;[620,700,780,860].forEach((f,i)=>blip(t0+i*.07,f))}

const landing=document.getElementById('landing'),strata=document.getElementById('strata'),btn=document.getElementById('toStrata'),
      box=document.getElementById('today'),lineEl=document.getElementById('line'),askEl=document.getElementById('ask'),ch=document.getElementById('choices');
let entered=false;
function typeLine(){lineEl.textContent='';let i=0;babble(6);
  const tick=()=>{if(i<LINE.length){lineEl.textContent+=LINE[i];if(i%5===4)babble(2);i++;setTimeout(tick,55)}
    else setTimeout(()=>{askEl.classList.add('on');ch.classList.add('on');giggle()},450)};tick()}
function enterStrata(){if(entered)return;entered=true;landing.classList.remove('on');strata.classList.add('on');btn.classList.add('hide');
  setTimeout(()=>{box.classList.add('show');typeLine()},900)}
btn.onclick=enterStrata;
document.addEventListener('keydown',e=>{if(e.key==='5'||e.key.toLowerCase()==='e')enterStrata()});
function choose(type){giggle();box.classList.remove('show');strata.contentWindow.postMessage({type},'*');strata.focus()}
document.getElementById('goMine').onclick=()=>choose('mined-explore');
document.getElementById('goTalk').onclick=()=>choose('mined-ask');
document.getElementById('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'소리 켜기':'소리 끄기'};
/* 랜딩의 마지막(4번 상세) 화면에 도착하면 버튼을 강조 — 같은 출처로 열었을 때만 동작, 아니면 버튼은 항상 보임 */
setInterval(()=>{try{const a=landing.contentDocument.querySelector('.screen.active');btn.classList.toggle('pulse',!!a&&a.id==='scr3')}catch(_){}},700);
</script>
</body>
</html>
