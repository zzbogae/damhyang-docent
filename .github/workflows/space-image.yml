# 「나의 공간」 그 자리 생성 그림 기능 검사.
# 타입 검사는 화면 전체를, vitest·pytest 는 이 기능의 테스트만 돈다.
# (전체 vitest 는 core 파이썬 venv·합성 인물·샘플 zip 이 있어야 해서 webapp/README.md 의 준비 단계가 필요하고,
#  e2e 는 main 에서도 실패하는 기존 스펙이 있어 여기 넣지 않는다.)
name: space-image

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npx vitest run tests/spaceImage.test.ts tests/spaceWords.test.ts

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi httpx pillow pytest
      - run: python -m pytest -q hf-space/tests
